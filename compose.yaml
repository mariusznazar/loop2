name: loop2

services:
  app:
    container_name: loop2
    build:
      context: .
      dockerfile: Dockerfile
      args:
        LOOP2_COMMIT: ${LOOP2_COMMIT:-unknown}
    environment:
      LOOP2_DATABASE_PATH: /app/data/accounts.sqlite
      LOOP2_SESSION_SECRET_FILE: /run/secrets/loop2_session_secrets
      LOOP2_PUBLIC_ORIGIN: https://loop2.mariusznazar.com
      LOOP2_PROXY_MODE: cloudflare-tunnel
      LOOP2_MAIL_FROM: loop2@mariusznazar.com
      LOOP2_SMTP_HOST: outsider.mikr.us
      LOOP2_SMTP_PORT: "587"
      LOOP2_SMTP_USER: loop2@mariusznazar.com
      LOOP2_SMTP_PASSWORD_FILE: /run/secrets/loop2_smtp_password
    secrets:
      - loop2_session_secrets
      - loop2_smtp_password
    volumes:
      - accounts:/app/data
    mem_limit: 512m
    restart: unless-stopped
    init: true

  cloudflared:
    container_name: loop2-cloudflared
    build:
      context: .
      dockerfile: deploy/cloudflared.Dockerfile
    command:
      - tunnel
      - --protocol
      - http2
      - --edge-ip-version
      - "4"
      - --metrics
      - 127.0.0.1:2000
      - run
      - --token-file
      - /run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 3

secrets:
  cloudflare_tunnel_token:
    file: /etc/loop2/cloudflared-token
  loop2_session_secrets:
    file: /etc/loop2/session-secrets
  loop2_smtp_password:
    file: /etc/loop2/smtp-password

volumes:
  accounts:
    name: loop2_accounts
