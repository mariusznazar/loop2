<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loop</title>
    <style>
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        padding: 0 16px;
        font-family: system-ui, sans-serif;
        line-height: 1.4;
        color: #1f2328;
        background: #f6f5f0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header h1 {
        margin: 16px 0;
        font-size: 1.6rem;
      }
      .columns {
        flex: 1;
        display: grid;
        grid-template-columns: minmax(260px, 1fr) minmax(320px, 1.4fr);
        gap: 24px;
        align-items: start;
      }
      @media (max-width: 720px) {
        .columns {
          grid-template-columns: 1fr;
        }
      }
      .program-panel,
      .map-column {
        background: #ffffff;
        border: 1px solid #d8d6cc;
        border-radius: 6px;
        padding: 12px 16px;
        min-height: 120px;
      }
      .program-editor h2 {
        margin: 0 0 8px;
        font-size: 1.2rem;
      }
      .rules {
        margin: 0 0 12px;
        padding-left: 1.6em;
      }
      .rule {
        margin-bottom: 8px;
      }
      .rule > * {
        margin: 0 4px 4px 0;
        vertical-align: middle;
      }
      .rule input[type="number"] {
        width: 4em;
        font: inherit;
      }
      .rule select {
        font: inherit;
      }
      .rule button {
        padding: 2px 8px;
      }
      .send-entry p {
        margin: 0 0 8px;
      }
      .send-character {
        font-weight: 600;
      }
      .status-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .status-text {
        margin: 0;
        margin-right: auto;
        font-variant-numeric: tabular-nums;
      }
      .terrain-panel {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 16px;
        margin-top: 12px;
      }
      .terrain-drawing {
        display: block;
        max-width: 100%;
        height: auto;
      }
      .terrain-drawing .tile polygon {
        fill: #34332e;
        stroke: #1c1b18;
        stroke-width: 1;
      }
      .terrain-drawing .tile.revealed polygon {
        fill: #dfe7cf;
        stroke: #8f9c7c;
      }
      .terrain-drawing .tile.hovered polygon {
        fill: #57554c;
      }
      .terrain-drawing .tile.revealed.hovered polygon {
        fill: #f5e9b0;
      }
      .terrain-drawing .icon.dimmed {
        opacity: 0.3;
      }
      .terrain-drawing .outline {
        fill: none;
        pointer-events: none;
        stroke-linejoin: round;
      }
      .terrain-drawing .outline.character {
        stroke: #e3a008;
        stroke-width: 4;
      }
      .terrain-drawing .outline.step-target {
        stroke: #e3a008;
        stroke-width: 2;
        stroke-dasharray: 5 4;
      }
      .tile-list {
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      .tile-list th,
      .tile-list td {
        padding: 2px 8px;
        text-align: right;
        white-space: nowrap;
      }
      .tile-list thead th {
        font-weight: 600;
        border-bottom: 1px solid #d8d6cc;
      }
      .tile-list thead img {
        vertical-align: middle;
      }
      .tile-list tbody th {
        text-align: left;
        font-weight: normal;
      }
      .tile-list tbody tr.hovered {
        background: #f5e9b0;
      }
      button {
        font: inherit;
        padding: 4px 12px;
        cursor: pointer;
      }
      footer {
        margin-top: 24px;
        padding: 12px 0 16px;
        border-top: 1px solid #d8d6cc;
        font-size: 0.85rem;
        color: #57606a;
      }
      .credits {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .credits a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <script type="module" src="/main.js"></script>
  </body>
</html>
