<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loop — trip inspection</title><link rel="stylesheet" href="/tokens.css"><link rel="stylesheet" href="/styles.css"></head><body><header><h1>Loop</h1></header><main></main><script type="module">
import * as game from '/sim/game.js';
import * as programs from '/sim/programs.js';
import {MAPS} from '/sim/data/maps.js';
import {createGameView} from '/view/game-view.js';
import {createProgramPanel} from '/view/program-panel.js';
import {createHeadquarters} from '/view/headquarters.js';
import {createStatusRow} from '/view/status-row.js';
import {createBodyRow} from '/view/body-row.js';
import {createCombatLine} from '/view/combat-line.js';
import {createTripLines} from '/view/trip-lines.js';
import {createTerrainPanel} from '/view/terrain-panel.js';
const main=document.querySelector('main');
if(location.search==='?real') { main.append(createGameView().element); }
else {
let state=game.createCharacter(game.newGame(),'Mag testowy').state;
state={...state,understanding:{actions:['explore','wander','gather'],conditions:['always','itemBelow'],items:['stick','berry','moss','fiber','campfire'],creatures:[]},team:{...state.team,chest:{pieces:{stick:10,berry:10,moss:2}}}};
function apply(result){state=result.state;render(result.events);}
const panel=createProgramPanel({
 editCopy:p=>apply(game.setProgram(state,p)), editProgram:(id,p)=>apply(programs.editProgram(state,id,p)),
 createProgram:()=>apply(programs.createProgram(state)),renameProgram:(id,n)=>apply(programs.renameProgram(state,id,n)),deleteProgram:id=>apply(programs.deleteProgram(state,id)),
 saveCopy:()=>apply(programs.saveCopyIntoProgram(state)),saveCopyAsNew:n=>apply(programs.saveCopyAsNewProgram(state,n)),discardCopy:()=>apply(programs.discardCopyChanges(state)),switchProgram:id=>apply(programs.switchProgram(state,id)),
});
const hq=createHeadquarters({create:n=>apply(game.createCharacter(state,n)),pick:(id,p)=>apply(programs.pickProgram(state,id,p)),send:(id,map,p)=>apply(game.send(state,{characterId:id,mapId:map,programId:p},23))});
const status=createStatusRow({togglePause:()=>apply(game.setPaused(state,!state.paused)),setPace:p=>apply(game.setPace(state,p)),restart:()=>apply(game.restart(state)),end:()=>apply(game.end(state))});
const body=createBodyRow(),combat=createCombatLine(),lines=createTripLines(),terrain=createTerrainPanel();
const columns=document.createElement('div');columns.className='columns';const map=document.createElement('section');map.className='map-column';const run=document.createElement('div');run.className='run-panel';
run.append(status.element,status.discovery,combat.element,lines.deposited,body.element,lines.preview,terrain.element);map.append(hq.element,run);columns.append(panel.element,map);main.append(columns);
function render(events=[]){panel.update(state,events);hq.update(state);status.update(state);combat.update(state.run?.lastCombat??null);body.update(state);lines.update(state);terrain.update(state);hq.element.hidden=state.run!==null;run.hidden=state.run===null;}
window.tripInspect={get:()=>state, replace:s=>{state=s;render();},step:n=>apply(game.advanceMinutes(state,n)),caps:(a,b)=>{MAPS.forest.carryIn=a;MAPS.forest.carryOut=b;render();},finish:()=>{state={...state,run:{...state.run,streak:479}};apply(game.advanceMinutes(state,1));}};
render();
}
</script></body></html>
